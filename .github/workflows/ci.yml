name: CI

# Compatibility is only claimed for cells that pass here (rule R13).
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * *'   # nightly: catches upstream breakage and Laravel 14 dev changes

jobs:
  boundary:
    name: Core boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - run: php tools/check-core-boundary.php

  laravel-matrix:
    name: L${{ matrix.laravel }} / PHP ${{ matrix.php }} / ${{ matrix.stability }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        laravel: ['9', '10', '11', '12', '13']
        php: ['8.1', '8.2', '8.3', '8.4']
        stability: [prefer-lowest, prefer-stable]
        exclude:
          - { laravel: '9',  php: '8.3' }
          - { laravel: '9',  php: '8.4' }
          - { laravel: '10', php: '8.4' }
          - { laravel: '11', php: '8.1' }
          - { laravel: '12', php: '8.1' }
          - { laravel: '13', php: '8.1' }
          - { laravel: '13', php: '8.2' }
        # adds the matching Testbench version to every combination of that Laravel version
        include:
          - { laravel: '9',  testbench: '^7.0' }
          - { laravel: '10', testbench: '^8.0' }
          - { laravel: '11', testbench: '^9.0' }
          - { laravel: '12', testbench: '^10.0' }
          - { laravel: '13', testbench: '^11.0' }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, libxml, mbstring, openssl, pdo_sqlite, sodium, bcmath
          coverage: none
      # Laravel 9-11 are end-of-life and every release has open security advisories; Composer 2.9+
      # refuses to install them by default. Allowed here only to prove compatibility.
      - name: Allow end-of-life Laravel ${{ matrix.laravel }}
        if: matrix.laravel == '9' || matrix.laravel == '10' || matrix.laravel == '11'
        run: composer config --no-interaction audit.block-insecure false
      - name: Pin Laravel ${{ matrix.laravel }}
        run: |
          composer require --no-update --no-interaction "illuminate/support:^${{ matrix.laravel }}.0"
          composer require --dev --no-update --no-interaction "orchestra/testbench:${{ matrix.testbench }}"
      - run: composer update --${{ matrix.stability }} --prefer-dist --no-interaction --with-all-dependencies
      - run: vendor/bin/phpunit --colors=always

  databases:
    name: ${{ matrix.db }} (L13 / PHP 8.3)
    # pinned: Microsoft's ODBC driver repository is published per Ubuntu release
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        db: [mysql, mariadb, pgsql, sqlsrv]
    services:
      mysql:
        image: ${{ matrix.db == 'mysql' && 'mysql:8.4' || '' }}
        env: { MYSQL_ROOT_PASSWORD: secret, MYSQL_DATABASE: zatca_test }
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
      mariadb:
        image: ${{ matrix.db == 'mariadb' && 'mariadb:10.11' || '' }}
        env: { MARIADB_ROOT_PASSWORD: secret, MARIADB_DATABASE: zatca_test }
        ports: ['3307:3306']
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=10s --health-timeout=5s --health-retries=5
      postgres:
        image: ${{ matrix.db == 'pgsql' && 'postgres:16' || '' }}
        env: { POSTGRES_PASSWORD: secret, POSTGRES_DB: zatca_test }
        ports: ['5432:5432']
        options: --health-cmd=pg_isready --health-interval=10s --health-timeout=5s --health-retries=5
      sqlsrv:
        image: ${{ matrix.db == 'sqlsrv' && 'mcr.microsoft.com/mssql/server:2022-latest' || '' }}
        env: { ACCEPT_EULA: 'Y', MSSQL_SA_PASSWORD: 'Secret_Passw0rd' }
        ports: ['1433:1433']
    steps:
      - uses: actions/checkout@v4
      # pdo_sqlsrv needs Microsoft's ODBC Driver 18, which the runner image does not include
      - name: Install Microsoft ODBC Driver 18
        if: matrix.db == 'sqlsrv'
        run: |
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
          curl -fsSL https://packages.microsoft.com/config/ubuntu/24.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, libxml, mbstring, openssl, pdo_mysql, pdo_pgsql, pdo_sqlsrv, sqlsrv, sodium, bcmath
          coverage: none
      - run: composer update --prefer-dist --no-interaction
      - name: Create SQL Server database
        if: matrix.db == 'sqlsrv'
        run: |
          for i in $(seq 1 30); do docker exec $(docker ps -q --filter ancestor=mcr.microsoft.com/mssql/server:2022-latest) /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Secret_Passw0rd' -Q 'CREATE DATABASE zatca_test' && break; sleep 3; done
      - name: Run suite on ${{ matrix.db }}
        env:
          ZATCA_TEST_DB: ${{ matrix.db }}
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ matrix.db == 'mariadb' && '3307' || '' }}
          DB_DATABASE: zatca_test
          DB_USERNAME: ${{ matrix.db == 'pgsql' && 'postgres' || matrix.db == 'sqlsrv' && 'sa' || 'root' }}
          DB_PASSWORD: ${{ matrix.db == 'sqlsrv' && 'Secret_Passw0rd' || 'secret' }}
        run: vendor/bin/phpunit --colors=always

  laravel-14-preview:
    name: Laravel 14 (dev, allowed to fail)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, libxml, mbstring, openssl, pdo_sqlite, sodium, bcmath
          coverage: none
      - name: Require Laravel 14.x-dev
        run: |
          composer config minimum-stability dev
          composer require --no-update --no-interaction "illuminate/support:14.x-dev"
          composer require --dev --no-update --no-interaction "orchestra/testbench:12.x-dev"
      - run: composer update --prefer-dist --no-interaction --with-all-dependencies
      - run: vendor/bin/phpunit --colors=always
